plugins {
    id 'com.android.application'
}

android {
    namespace 'kr.kkumtree.servingrobot'
    compileSdk 34

    defaultConfig {
        applicationId "kr.kkumtree.servingrobot"
        minSdk 24
        targetSdk 34
        versionCode 1
        versionName "1.0"
    }

    buildTypes {
        debug {
            minifyEnabled false
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}

dependencies {
    implementation 'androidx.webkit:webkit:1.8.0'
}
