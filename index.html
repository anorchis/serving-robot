<style>
@font-face { font-family:'Hanna'; src:url('BMHANNAPro.ttf') format('truetype'); font-display:swap; }
:root{
  --blue:#1f7cf5; --blue-d:#1767d1; --blue-l:#e9f2fe; --blue-ll:#f4f8ff;
  --ink:#1f2328; --ink2:#5b6370; --ink3:#9aa1ab; --line:#e4e7eb;
  --key:#f2f3f5; --card:#f5f6f8; --red:#e5484d; --mint:#2cc2b5;
}
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
html{font-size:clamp(10px, min(3.6vw, 2.15vh), 30px)}
/* 반응형: 컴퓨터처럼 가로로 넓은 화면에서도 실제 로봇 화면(세로 10:16) 틀 안에 보여 줘요 */
html,body{background:#dfe3e8}
#frame{position:relative;height:100%;width:100%;margin:0 auto;background:#fff;overflow:hidden;transform:translateZ(0)}
@media (min-aspect-ratio: 4/5){ #frame{width:min(100%, 62.5vh);box-shadow:0 0 24px rgba(0,0,0,.12)} }   /* 태블릿·폰(세로)은 꽉 채우고, 컴퓨터처럼 가로로 넓을 때만 로봇 화면 틀 */
/* 왼쪽 위 메뉴(≡) 버튼: 화면에 메뉴 버튼이 없을 때 항상 보여 줘요 */
#gMenu{position:absolute;top:calc(env(safe-area-inset-top) + .4rem);left:.9rem;z-index:45;display:none;width:2.6rem;height:2.6rem;align-items:center;justify-content:center;border-radius:50%;background:rgba(255,255,255,.75)}
#gMenu.on{display:flex}
/* 메뉴 버튼이 겹치지 않게 제목을 오른쪽으로 */
.gd.set > .gd-set-head:first-child h2, #redit .body > h3{padding-left:2.6rem}
html,body{height:100%;background:#fff;color:var(--ink);overflow:hidden;
  font-family:'Pretendard','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif;
  -webkit-user-select:none;user-select:none;overscroll-behavior:none}
button{font:inherit;color:inherit;background:none;border:0;cursor:pointer}
input,textarea,select{font:inherit;color:inherit;-webkit-user-select:text;user-select:text}
svg{display:block}
.ico{width:1.6rem;height:1.6rem;fill:none;stroke:currentColor;stroke-width:1.7;stroke-linecap:round;stroke-linejoin:round}

.screen{position:fixed;inset:0;display:none;flex-direction:column;background:#fff;
  padding:env(safe-area-inset-top) env(safe-area-inset-right) env(safe-area-inset-bottom) env(safe-area-inset-left)}
.screen.on{display:flex}

/* ── 상단바 ── */
.topbar{height:3.4rem;flex:none;display:flex;align-items:center;justify-content:space-between;padding:0 .9rem}
.topbar .grp{display:flex;align-items:center;gap:.9rem}
.iconbtn{width:2.4rem;height:2.4rem;display:grid;place-items:center;border-radius:.6rem;color:var(--ink)}
.iconbtn:active{background:var(--key)}
.modeicons{display:flex;gap:.5rem}
.modeicons .iconbtn{color:#c5cad1}
.modeicons .iconbtn.on{color:var(--blue)}

/* ── 서빙 홈 ── */
.home-body{flex:1;display:flex;flex-direction:column;align-items:center;overflow:auto;padding:0 .9rem}
.trays{width:min(60%, 16rem);display:flex;flex-direction:column;gap:.35rem;margin-top:.4rem}
.tray{position:relative;height:2.7rem;border-radius:.3rem;border:1.5px solid transparent;background:#fff;
  box-shadow:0 0 0 1px #eef0f3 inset;display:flex;align-items:center;justify-content:center;color:var(--ink3);font-size:.8rem}
.tray .no{position:absolute;left:.8rem;font-size:.75rem;color:#c3c8cf}
.tray.active{border-color:var(--blue);box-shadow:none}
.tray.filled{background:var(--blue-l);box-shadow:none;color:var(--blue);font-size:1.25rem;font-weight:700}
.tray.filled .no{color:var(--blue)}
.tray .x{position:absolute;right:.4rem;width:1.9rem;height:1.9rem;display:grid;place-items:center;color:var(--blue)}
.tray .x .ico{width:1.1rem;height:1.1rem}
.tray .nm{font-size:.7rem;font-weight:500;margin-left:.4rem;color:var(--blue-d)}
.badge{margin:1.3rem 0 .8rem;width:1.6rem;height:1.6rem;border-radius:50%;background:var(--blue);color:#fff;
  font-size:.8rem;font-weight:700;display:grid;place-items:center}
.keypad{width:100%;display:grid;gap:.3rem}
.key{height:3.3rem;border-radius:.25rem;background:var(--key);font-size:1.15rem;display:flex;flex-direction:column;
  align-items:center;justify-content:center;line-height:1.15;transition:background .12s}
.key small{font-size:.62rem;color:var(--ink2);margin-top:.15rem}
.key:active{background:#e3e6ea}
.key.used{background:var(--blue-l);color:var(--blue);font-weight:700}
.key.used small{color:var(--blue-d)}
.numpad-wrap{width:min(80%, 20rem);display:flex;flex-direction:column;gap:.5rem}
.numpad-input{height:2.8rem;border:1.5px solid var(--blue);border-radius:.3rem;display:flex;align-items:center;
  justify-content:center;font-size:1.3rem;font-weight:700;color:var(--blue)}
.numpad-input.empty{color:var(--ink3);font-size:.85rem;font-weight:400}
.numpad{display:grid;grid-template-columns:repeat(3,1fr);gap:.3rem}
.bottombar{flex:none;display:flex;gap:.7rem;padding:.8rem .9rem 1rem}
.btn{height:3rem;border-radius:.3rem;font-size:.95rem;display:flex;align-items:center;justify-content:center;gap:.4rem}
.btn-out{border:1.5px solid var(--blue);color:var(--blue);background:#fff}
.btn-out.on{background:var(--blue-l)}
.btn-fill{background:var(--blue);color:#fff}
.btn-fill:active{background:var(--blue-d)}
.btn-gray{background:var(--key);color:var(--ink)}
.soup-btn{flex:0 0 34%}
.send-btn{flex:1}
.modechip{margin-top:.6rem;font-size:.75rem;color:var(--blue);background:var(--blue-l);padding:.25rem .7rem;border-radius:1rem;display:none}
.modechip.show{display:block}

/* ── 이동중 / 복귀중 ── */
#moving{align-items:center;justify-content:center;text-align:center}
.mv-top{position:absolute;top:calc(env(safe-area-inset-top) + 4.5rem);left:0;right:0;display:flex;flex-direction:column;align-items:center;gap:.4rem}
.mv-hello{font-size:1.1rem;font-weight:700;color:var(--blue)}
.mv-chip{font-size:.75rem;color:var(--blue);background:var(--blue-l);padding:.25rem .7rem;border-radius:1rem}
.mv-num{font-size:7.5rem;font-weight:800;color:var(--blue);line-height:1;letter-spacing:-.02em}
.mv-num.text{font-size:3.2rem;line-height:1.15;padding:0 1rem;word-break:keep-all}
.mv-num.ret{font-size:4.4rem;line-height:1.1}
.mv-num .ico{width:7rem;height:7rem;stroke-width:1.6}
.mv-name{font-size:1.1rem;color:var(--blue-d);margin-top:.6rem;font-weight:600;min-height:1.4rem}
.mv-state{font-size:2.6rem;font-weight:800;margin-top:1.6rem;letter-spacing:-.02em}
.mv-state .dots span{animation:blink 1.4s infinite both}
.mv-state .dots span:nth-child(2){animation-delay:.2s}.mv-state .dots span:nth-child(3){animation-delay:.4s}
@keyframes blink{0%,80%,100%{opacity:.15}40%{opacity:1}}
.mv-next{margin-top:1.4rem;font-size:.8rem;color:var(--ink3);display:flex;gap:.35rem;align-items:center;flex-wrap:wrap;justify-content:center;padding:0 1rem}
.mv-next b{color:var(--ink2);font-weight:600;background:var(--key);padding:.15rem .5rem;border-radius:.3rem}
.mv-done{position:absolute;bottom:calc(env(safe-area-inset-bottom) + 1.2rem);left:0;right:0;display:none;flex-direction:column;align-items:center;gap:.5rem}
.mv-done .btn{height:3.1rem;padding:0 2.2rem;font-weight:700;font-size:1.05rem}
.mv-done .hint2{font-size:.8rem;color:var(--ink2)}
#moving.manual .mv-done{display:flex}#moving.nopause .mv-done .hint2{display:none}#moving.manual #mvHint{display:none}
.hint{position:absolute;bottom:calc(env(safe-area-inset-bottom) + 1.4rem);left:0;right:0;text-align:center;font-size:.85rem;color:var(--ink2)}

/* ── 돌아다니기 (실제 앱: 얼굴 + 로봇 출발 / 경로 확인·수정) ── */
#roam .face-wrap{flex:1;display:flex;align-items:center;justify-content:center}
.rface{width:min(62%,15rem);height:auto}
#roam .bottom2{flex:none;display:flex;flex-direction:column;gap:.6rem;padding:.8rem .9rem 1.1rem}
#roam .bottom2 .btn{height:3.1rem;font-weight:600}
#rpath .head{display:flex;justify-content:flex-end;padding:.6rem .8rem 0}
#rpath .box{margin:.6rem 1rem;background:var(--card);border-radius:.4rem;padding:1rem .9rem}
#rpath .box h4{font-size:.85rem;font-weight:600;color:var(--ink2);margin-bottom:.7rem}
.rp-row{display:flex;align-items:center;gap:.6rem;background:#fff;border:1.5px solid #dfe3e8;border-radius:.35rem;height:3rem;padding:0 .8rem;margin-bottom:.5rem;width:100%;font-size:.95rem}
.rp-row.on{border-color:var(--blue)}
.rp-row .rd{width:1.1rem;height:1.1rem;border-radius:50%;border:2px solid #c3c9d1;flex:none}
.rp-row.on .rd{border:5px solid var(--blue)}
.rp-row .nm{flex:1;text-align:left}
.rp-row .go{width:2.2rem;height:2.2rem;display:grid;place-items:center;color:var(--ink2)}
.rp-add{width:100%;height:2.6rem;font-size:.9rem;color:var(--ink)}
#redit .body{flex:1;overflow:auto;padding:.4rem 1.1rem 0}
#redit h3{font-size:1.15rem;font-weight:700;margin:.6rem 0 1.1rem}
#redit .lb{font-size:.8rem;color:var(--ink2);margin:0 0 .4rem}
#redit .rowx{display:flex;justify-content:space-between;align-items:center;margin:1rem 0 .8rem;font-size:.85rem}
#redit select{border:none;background:none;font-size:.85rem}
.re-path{background:var(--card);border-radius:.4rem;padding:.8rem;min-height:9rem}
.re-path .tg{display:inline-block;font-size:.72rem;color:var(--blue);background:var(--blue-l);padding:.1rem .45rem;border-radius:.25rem;margin-bottom:.6rem}
.re-stops{display:grid;grid-template-columns:repeat(3,1fr);gap:.9rem .5rem}
.re-stop{position:relative;background:#fff;border-radius:.3rem;height:2.6rem;display:flex;align-items:center;justify-content:space-between;padding:0 .55rem;font-size:.95rem;font-weight:600}
.re-stop small{font-size:.72rem;color:var(--ink2);font-weight:400}
.re-stop .ord{position:absolute;top:-1rem;left:.1rem;font-size:.62rem;color:var(--ink3);font-weight:400}
.re-stop .del{position:absolute;top:-.45rem;right:-.4rem;width:1.15rem;height:1.15rem;border-radius:50%;background:#9aa1ab;color:#fff;font-size:.7rem;display:grid;place-items:center;line-height:1}
.re-empty{font-size:.8rem;color:var(--ink3);text-align:center;padding:1.6rem 0}
#redit .tblpad{flex:none;background:var(--card);padding:.7rem .9rem .5rem}
#redit .tblpad .lb{color:var(--blue)}
#redit .tblpad .grid{display:grid;grid-template-columns:repeat(4,1fr);gap:.4rem}
#redit .tblpad .key{height:2.6rem;background:#fff;font-size:1rem}
#redit .foot{flex:none;display:grid;grid-template-columns:1fr 1fr;border-top:1px solid #eceef1}
#redit .foot button{height:3.2rem;font-size:.95rem}
#redit .foot .ok{color:var(--blue);font-weight:700}
.rpause{position:fixed;inset:0;z-index:61;background:#fff;display:none;flex-direction:column;align-items:center}
.rpause.on{display:flex}
.rpause .mid{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:.5rem}
.rpause h2{font-size:2.8rem;font-weight:800}
.rpause .sec{font-size:1.6rem}
.rpause .hint3{font-size:.85rem;color:var(--ink2);margin-bottom:.7rem}
.rpause .acts{width:100%;display:flex;flex-direction:column;gap:.6rem;padding:0 .9rem 1.1rem}
.rpause .acts .btn{height:3.1rem;font-weight:600}

/* ── 홍보하기 (실제 앱: 미리보기 + 홍보 장소 / 홍보 시작 · 홍보 장소 바꾸기) ── */
#promo .pm-mid{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:.8rem}
#promo .pm-tag{font-size:.75rem;color:var(--blue);border:1px solid #e3e6ea;border-radius:.3rem;padding:.25rem .8rem;background:#fff}
#promo .ph-frame{position:relative;width:min(46%,11rem);aspect-ratio:10/16;border-radius:.6rem;overflow:hidden;border:.3rem solid #16181c}
#promo .pm-place{font-size:.95rem;color:var(--ink)}
#promo .bottom2{flex:none;display:flex;flex-direction:column;gap:.6rem;padding:.8rem .9rem 1.1rem}
#promo .bottom2 .btn{height:3.1rem;font-weight:600}
.mv-num.ret.wp{font-size:3rem;line-height:1.2;padding:0 1rem;word-break:keep-all}
.mv-num.ret.wp small{font-size:.5em;color:var(--ink);font-weight:700;margin-left:.25em}   /* 「장소로」는 검은 작은 글씨 */
.mv-num.ret.sm{font-size:3.3rem}

html.screen-dim::after{content:'';position:fixed;inset:0;background:rgba(0,0,0,.3);pointer-events:none;z-index:999}   /* 화면 흐리게 */

/* ── 영업 미션 띠 (실제 앱 화면 위에 얹는 진행 표시) ── */
html.bz-on .screen{top:3.8rem}
html.bz-on #gMenu{top:4.2rem}
#bizStrip{position:absolute;top:0;left:0;right:0;z-index:46;display:none}
html.bz-on #bizStrip{display:block}
.bs-bar{width:100%;min-height:3.8rem;height:3.8rem;background:#fff3a8;color:#2b2f36;border:3px solid #e5484d;border-radius:0 0 .7rem .7rem;box-shadow:0 3px 10px rgba(229,72,77,.25);display:flex;align-items:center;gap:.5rem;padding:0 .8rem;font-size:.82rem}
.bs-bar .rd{background:#2cc2b5;border-radius:.3rem;padding:.12rem .45rem;font-weight:700;font-size:.7rem;flex:none}
.bs-bar{cursor:pointer}
.bs-bar .now{flex:1;text-align:left;font-weight:700;font-size:1.12rem;line-height:1.35;word-break:keep-all;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}   /* 할 일 글자만 크게, 두 줄까지 */
.bs-bar .now .mtag{font-style:normal;font-size:.7rem;font-weight:800;color:#fff;background:#e5484d;border-radius:.25rem;padding:.08rem .35rem;margin-right:.45rem;vertical-align:.18em}
.bs-bar .now em{font-style:normal;font-weight:600;font-size:.7rem;color:#9fe3dc;margin-right:.45rem}
.bs-bar .now b{color:#d6262c}
.bs-man{flex:none;background:#2cc2b5;color:#fff;border-radius:1rem;padding:.3rem .7rem;font-size:.75rem;font-weight:700}
.bs-bar.flash{animation:bsflash .7s}
@keyframes bsflash{0%{background:#ffb3b5;transform:scale(1.02)}100%{background:#fff3a8;transform:none}}
.bs-lines{list-style:none;display:flex;flex-direction:column;gap:.3rem;font-size:.82rem;line-height:1.45}
.bs-lines li{display:flex;gap:.5rem;align-items:flex-start;padding:.35rem .45rem;border-radius:.5rem;color:var(--ink3)}
.bs-lines li > b{flex:none;width:1.35rem;height:1.35rem;border-radius:50%;background:#e9e2d2;color:#fff;font-size:.68rem;display:grid;place-items:center}
.bs-lines li.ok{color:#178f86}.bs-lines li.ok > b{background:#2cc2b5}
.bs-lines li.now{background:#2b2f36;color:#fff;font-weight:700}.bs-lines li.now > b{background:#ffd166;color:#2b2f36}
.bs-lines li.now span b{color:#ffd166}
.bs-man2{margin-left:.3rem;background:#2cc2b5;color:#fff;border-radius:1rem;padding:.15rem .6rem;font-size:.72rem}
.bs-skip{display:block;margin:.6rem auto 0;font-size:.7rem;color:var(--ink3)}
.bs-ctl2{display:flex;gap:.35rem;margin-top:.45rem}
.bs-ctl2 button{flex:1;height:2.2rem;border-radius:.5rem;background:#fff;box-shadow:0 0 0 1px #e9dfc7 inset;font-size:.72rem;font-weight:700;color:var(--ink2)}
.bs-ctl{display:grid;grid-template-columns:1fr 1.3fr 1fr;gap:.35rem;margin-top:.6rem}
.bs-ctl button{height:2.3rem;border-radius:.5rem;background:#f3ecdc;font-size:.75rem;font-weight:700;color:var(--ink2)}
.bs-dots{display:flex;gap:.25rem;flex:none}.bs-dots i{width:.55rem;height:.55rem;border-radius:50%;background:#5b6370}
.bs-dots i.on{background:#2cc2b5}.bs-dots i.cur{background:#fff;box-shadow:0 0 0 2px #2cc2b5}
.bs-bar .arw{transition:transform .2s;flex:none}#bizStrip.open .bs-bar .arw{transform:rotate(180deg)}
.bs-dim{position:absolute;left:0;right:0;top:3.8rem;height:100vh;background:rgba(0,0,0,.35);display:none}
#bizStrip.open .bs-dim{display:block}
.bs-panel{position:absolute;left:0;right:0;top:3.8rem;max-height:calc(100vh - 6rem);overflow:auto;background:#fffaf0;display:none;padding:.9rem .9rem 1rem;box-shadow:0 10px 24px rgba(0,0,0,.18);border-radius:0 0 .9rem .9rem}
#bizStrip.open .bs-panel{display:block}
.bs-head{display:flex;align-items:center;gap:.6rem;margin-bottom:.7rem}
.bs-head .fn{width:2.6rem;height:2.6rem;border-radius:50%;color:#fff;font-family:'Hanna',sans-serif;font-size:1.4rem;display:grid;place-items:center;flex:none}
.bs-head .t{font-family:'Hanna',sans-serif;font-size:1.1rem}.bs-head .s{font-size:.72rem;color:var(--ink2)}
.bs-steps{display:grid;grid-template-columns:repeat(5,1fr);gap:.3rem;margin-bottom:.8rem}
.bs-steps div{background:#fff;border-radius:.5rem;padding:.4rem .1rem;text-align:center;font-size:.66rem;color:var(--ink3);box-shadow:0 0 0 1px #efe6d2 inset}
.bs-steps div b{display:block;font-size:1.1rem;line-height:1.3}
.bs-steps div.on{background:#e6f8f6;color:#178f86;box-shadow:0 0 0 1px #9fe3dc inset}
.bs-steps div.cur{background:#2b2f36;color:#fff;box-shadow:none}
.bs-card{background:#fff;border-radius:.8rem;padding:.85rem;margin-bottom:.7rem;box-shadow:0 0 0 1px #f3ecdc inset}
.bs-card h4{font-family:'Hanna',sans-serif;font-weight:400;font-size:1.05rem;margin-bottom:.5rem;display:flex;justify-content:space-between;align-items:center}
.bs-card h4 small{font-family:'Pretendard',sans-serif;font-size:.7rem;color:var(--ink2)}
.bs-how{counter-reset:h;display:flex;flex-direction:column;gap:.35rem;font-size:.82rem;line-height:1.45}
.bs-how li{list-style:none;counter-increment:h;display:flex;gap:.45rem;word-break:keep-all}
.bs-how li::before{content:counter(h);flex:none;width:1.3rem;height:1.3rem;border-radius:50%;background:#2b2f36;color:#fff;font-size:.68rem;display:grid;place-items:center;margin-top:.05rem}
.bs-go{width:100%;margin-top:.7rem}
.bs-req{display:flex;flex-wrap:wrap;gap:.35rem;margin:.1rem 0 .6rem}
.bs-req span{font-size:.72rem;font-weight:700;padding:.2rem .55rem;border-radius:1rem;background:#fff1e6;color:#c4561f}
.bs-items{display:flex;flex-direction:column;gap:.4rem}
.bs-item{display:flex;align-items:center;gap:.6rem;padding:.35rem .5rem;border-radius:.6rem;background:#faf6ee;width:100%;text-align:left}
.bs-item .food{width:2.8rem}
.bs-item .nm{flex:1;font-weight:700;font-size:.9rem;line-height:1.25;word-break:keep-all}
.bs-item .nm small{display:block;font-weight:400;font-size:.68rem;color:var(--ink2)}
.bs-item .ck{font-size:.7rem;padding:.25rem .5rem;border-radius:1rem;background:#fff;box-shadow:0 0 0 1px #d8cdb6 inset;color:var(--ink2);flex:none}
.bs-item.on{background:#e6f8f6}.bs-item.on .ck{background:#2cc2b5;color:#fff;box-shadow:none}
.bs-note{font-size:.75rem;color:#c4561f;margin-top:.3rem}
.bs-done{text-align:center;padding:.4rem 0}
.bs-done .big{font-family:'Hanna',sans-serif;font-size:1.6rem;color:#178f86}
.bs-teacher{display:block;margin:.4rem auto 0;font-size:.72rem;color:var(--ink3);text-decoration:underline}
.gw-grid{display:grid;grid-template-columns:repeat(4,1fr);gap:.4rem}
.gw-grid .key{height:3.4rem;font-size:.95rem;line-height:1.2}
.gw-grid .key small{display:block;font-size:.65rem;color:var(--ink2)}

/* ── 도착 ── */
.arr-body{flex:1;display:flex;flex-direction:column;align-items:center;overflow:auto;padding:.3rem 1rem 0}
.arr-msg{text-align:center;font-size:1rem;line-height:1.55;font-weight:500;margin:.4rem 0 1.1rem;word-break:keep-all}
.arr-trays{width:min(66%, 18rem);display:flex;flex-direction:column;gap:.4rem}
.arr-tray{position:relative;height:4.2rem;border-radius:.3rem;box-shadow:0 0 0 1px #edf0f3 inset;background:#fff;
  display:flex;align-items:center;justify-content:center;font-size:1.6rem;font-weight:700;color:var(--blue)}
.arr-tray .no{position:absolute;left:.7rem;top:50%;transform:translateY(-50%);font-size:.7rem;color:#c3c8cf;font-weight:400}
.arr-tray.hit{box-shadow:0 0 0 2px var(--blue) inset;background:var(--blue-ll);animation:pulse 1.6s infinite}
.arr-tray.hit .no{color:var(--blue)}
.arr-tray .sub{font-size:.75rem;font-weight:500;margin-left:.5rem;color:var(--blue-d)}
@keyframes pulse{0%,100%{box-shadow:0 0 0 2px var(--blue) inset}50%{box-shadow:0 0 0 2px var(--blue) inset,0 0 0 .35rem rgba(31,124,245,.15)}}
.kit-grid{display:grid;grid-template-columns:1fr 1fr;gap:.5rem}
.kit-grid button{position:relative;display:flex;flex-direction:column;align-items:center;gap:.15rem;padding:.5rem;border-radius:.7rem;border:2px solid #e3e6ea;background:#fff;font-size:.85rem}
.kit-grid button img{width:70%;aspect-ratio:1;object-fit:cover;border-radius:.5rem}
.kit-grid button small{font-size:.65rem;color:var(--ink3)}
.kit-grid button.on{border-color:var(--blue);background:var(--blue-ll)}
.kit-grid button.snack{grid-column:1/3;flex-direction:row;justify-content:center;gap:.8rem}
.kit-grid button.snack img{width:6rem;aspect-ratio:3/2}
.kit-grid .ord{position:absolute;top:.35rem;left:.35rem;width:1.5rem;height:1.5rem;border-radius:50%;background:var(--blue);color:#fff;font-weight:800;font-size:.8rem;display:grid;place-items:center}
.kit-items{display:flex;flex-wrap:wrap;justify-content:center;gap:.7rem;margin-top:.6rem}
.kit-items div{display:flex;flex-direction:column;align-items:center;gap:.2rem;width:8rem;font-size:.9rem;text-align:center;word-break:keep-all;line-height:1.3}   /* 긴 신메뉴 이름도 줄바꿈 */
.kit-items .food{width:5rem}
.arr-big{font-size:2.6rem;font-weight:800;color:var(--blue);margin:1.5rem 0 .5rem;text-align:center;word-break:keep-all}
.arr-song{margin-top:1rem}

/* ── 사이드 메뉴 ── */
.dim{position:fixed;inset:0;background:rgba(0,0,0,.42);z-index:50;opacity:0;pointer-events:none;transition:opacity .2s}
.dim.on{opacity:1;pointer-events:auto}
.drawer{position:fixed;top:0;bottom:0;left:0;width:min(72%, 22rem);background:#fff;z-index:51;transform:translateX(-102%);
  transition:transform .22s ease;display:flex;flex-direction:column;padding:calc(env(safe-area-inset-top) + .8rem) 1rem calc(env(safe-area-inset-bottom) + 1rem)}
.drawer.on{transform:none}
.dr-head{display:flex;align-items:center;justify-content:space-between;margin-bottom:1.2rem}
.logo{display:flex;align-items:center;gap:.35rem;font-weight:900;font-size:1.05rem;letter-spacing:-.03em}
.logo .a{color:var(--mint)}.logo .b{color:#2b2f36}
.logo .face{width:1.5rem;height:1.5rem}
.dr-sec{font-size:.68rem;color:var(--ink3);margin:.6rem 0 .3rem}
.dr-item{display:flex;align-items:center;justify-content:space-between;height:2.9rem;font-size:1.05rem;width:100%;text-align:left}
.dr-item .ico{width:1.2rem;height:1.2rem;color:var(--ink2)}
.dr-item.cur{color:var(--blue);font-weight:700}
.dr-stat{margin-top:auto;font-size:.75rem;color:var(--ink2);background:var(--card);border-radius:.4rem;padding:.6rem .8rem;margin-bottom:.7rem;line-height:1.5}
.dr-close{height:2.7rem;border:1px solid var(--line);border-radius:.3rem;width:100%;font-size:.9rem}

/* ── 콘텐츠(돌아다니기·홍보) ── */
.cv{position:absolute;inset:0;overflow:hidden;font-size:1rem;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center}
.cv .t1{font-family:'Hanna','Pretendard',sans-serif;font-size:2.7em;line-height:1.22;white-space:pre-wrap;word-break:keep-all;padding:0 .45em;letter-spacing:-.01em}
.cv .t2{font-size:1.1em;line-height:1.45;white-space:pre-wrap;word-break:keep-all;padding:0 1.3em;font-weight:600}
.cv .imgbox{position:relative;overflow:hidden;display:flex;align-items:center;justify-content:center}
.cv .imgbox img,.cv .imgbox video{width:100%;height:100%;object-fit:cover}
.cv .imgbox.contain img,.cv .imgbox.contain video{object-fit:contain}
.cv .sprite{aspect-ratio:1;height:100%;max-width:100%;background-image:url('food.png');background-size:500% 400%;background-repeat:no-repeat}
.cv .pbg{position:absolute;inset:-6%;background-size:cover;background-position:center;filter:blur(18px) brightness(.95)}
.cv .pimg{position:absolute;inset:0;width:100%;height:100%;object-fit:contain}
.cv.poster .hint2{bottom:2.5%;left:50%;right:auto;transform:translateX(-50%);background:rgba(255,255,255,.85);color:#2b2f36 !important;padding:.35em .9em;border-radius:1em;white-space:nowrap;opacity:1}
.cv .hint2{position:absolute;bottom:4%;left:0;right:0;font-size:.8em;text-align:center;opacity:.85}
.cv .ph{outline:2px dashed #3ec46d;outline-offset:.2em;min-width:6em;min-height:1.2em;cursor:text;-webkit-user-select:text;user-select:text}
.cv .ph:empty:before{content:attr(data-ph);opacity:.55}
.cv .ph:focus{outline-color:var(--blue)}
.cv .shade{position:absolute;inset:0;background:linear-gradient(180deg,rgba(0,0,0,.45) 0%,rgba(0,0,0,.05) 45%,rgba(0,0,0,.35) 100%)}
.cv .layer{position:relative;display:flex;flex-direction:column;align-items:center;gap:.8em;width:100%}
#display .cv{cursor:pointer}

/* ── 안내하기 ── */
.guide-body{flex:1;overflow:auto;padding:0 .9rem 1rem}
.guide-title{font-size:1.5rem;font-weight:800;text-align:center;margin:1rem 0 1.4rem;word-break:keep-all}
.guide-grid{display:grid;grid-template-columns:repeat(2,1fr);gap:.4rem}
.guide-grid .key{height:3.6rem;font-size:1rem}
.guide-sec{font-size:.75rem;color:var(--ink3);margin:1rem 0 .4rem}
/* 안내하기 (실물: 출발지 설정 → 어서오세요 → 예약 → 인원 → 확인 완료) */
.gd{flex:1;display:flex;flex-direction:column;padding:0 1.2rem calc(1.1rem + env(safe-area-inset-bottom));min-height:0}
.gd-center{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;word-break:keep-all}
.gd-q{font-size:2.1rem;font-weight:800;letter-spacing:-.02em;line-height:1.3}
.gd-btns{display:flex;flex-direction:column;gap:.5rem}
.gd-btns .btn{height:3.3rem;font-size:1.05rem;font-weight:600}
.gd-btns .btn:disabled{opacity:.45}
.gd-wel{font-size:3.6rem;font-weight:800;color:var(--blue);letter-spacing:-.03em}
.gd-sub{font-size:1.05rem;color:var(--ink);margin-top:.5rem}
.gd-hint{font-size:.9rem;color:var(--ink2);text-align:center;line-height:1.55;margin-bottom:1.6rem}
.gd-start .lb{font-size:2.1rem;font-weight:800;letter-spacing:-.02em;line-height:1.3;color:var(--ink)}
.gd-start .n{font-size:2.1rem;font-weight:800;color:var(--blue);line-height:1.3}
.gd-start .n small.wp{font-size:1.1rem;font-weight:700;margin-left:.25em}
.gd-start .n small{font-size:2.1rem;color:var(--ink);font-weight:800}
.gd-cnt{font-size:.8rem;color:var(--ink2);text-align:center;margin-bottom:.5rem}
.gd-sel{display:inline-flex;align-items:center;gap:.7rem;margin-top:1.3rem;font-size:1rem;color:var(--ink2)}
.gd-sel button{display:inline-flex;align-items:center;gap:.6rem;border-bottom:1.5px solid var(--ink3);padding:.25rem .3rem .25rem .6rem;font-size:1.25rem;font-weight:700;color:var(--ink)}
.gd-sel .ico{width:1.1rem;height:1.1rem;color:var(--ink2)}
.gd-ok{color:var(--blue);font-weight:700;font-size:1rem;display:flex;flex-direction:column;align-items:center;gap:.3rem;margin-bottom:1.1rem}
.gd-ok .ico{width:1.8rem;height:1.8rem;stroke-width:2.2}
.gd-box{width:100%;background:var(--card);border-radius:.4rem;padding:1.3rem 1rem;display:flex;flex-direction:column;gap:1.1rem}
.gd-box span{display:block;font-size:.75rem;color:var(--ink2)}
.gd-box b{display:block;font-size:1.6rem;font-weight:800;margin-top:.2rem}
.gd-staff{font-size:.75rem;color:var(--ink3);text-decoration:underline;padding:.6rem;align-self:center}
.gd-set-head{display:flex;align-items:center;justify-content:space-between;height:3.4rem}
.gd-set-head h2{font-size:1.05rem;font-weight:700}
.gd-set-head .two{display:flex;gap:.35rem}
.gd-set-head .two .btn{height:2.2rem;padding:0 1rem;font-size:.85rem;font-weight:700}
.gd-set-sec{display:inline-block;font-size:.7rem;color:var(--blue);background:var(--blue-l);font-weight:600;padding:.1rem .4rem;border-radius:.2rem;margin-top:.2rem}
.gd-set-desc{font-size:.7rem;color:var(--ink3);margin:.3rem 0 .6rem}
.gd-set-val{min-height:3.2rem;margin-bottom:1rem;display:flex}
.gd-set-card{background:#fff;border-radius:.4rem;padding:.9rem .8rem}
.gd-set-card .grid4{display:grid;grid-template-columns:repeat(4,1fr);gap:.4rem}
.gd-set-card .key{height:2.6rem;font-size:1rem}
.gd-set-val .key{width:calc((100% - 1.2rem)/4)}
#guide .gd.set,#promo .gd.set{background:var(--card)}
.gd-list{max-height:60vh;overflow:auto;display:flex;flex-direction:column}
.gd-list button{height:3rem;font-size:1.1rem;border-bottom:1px solid var(--line)}
.gd-list button.on{color:var(--blue);font-weight:800}

/* ── 설정 ── */
.tabs{flex:none;display:flex;gap:.4rem;overflow-x:auto;padding:.2rem .9rem .7rem;scrollbar-width:none}
.tabs::-webkit-scrollbar{display:none}
.tab{flex:none;height:2.2rem;padding:0 1rem;border-radius:1.2rem;border:1px solid var(--line);font-size:.85rem;color:var(--ink2);background:#fff}
.tab.on{background:var(--blue);border-color:var(--blue);color:#fff}
.set-body{flex:1;overflow:auto;padding:0 .9rem 2rem;-webkit-overflow-scrolling:touch}
.card{background:var(--card);border-radius:.4rem;padding:.9rem .8rem;margin-bottom:.7rem}
.card h3{font-size:.9rem;font-weight:600;margin-bottom:.7rem;display:flex;justify-content:space-between;align-items:center}
.card h3 .r{font-size:.75rem;font-weight:400;color:var(--ink2)}
.box{background:#fff;border-radius:.3rem;padding:.7rem .8rem;margin-top:.45rem}
.box:first-of-type{margin-top:0}
.chip{display:inline-block;font-size:.65rem;color:var(--blue);background:var(--blue-l);padding:.12rem .4rem;border-radius:.2rem;margin-bottom:.55rem}
.steps{position:relative;display:flex;justify-content:space-between;padding-top:.15rem}
.steps:before{content:'';position:absolute;left:.5rem;right:.5rem;top:.62rem;height:1px;background:#e3e6ea}
.step{position:relative;display:flex;flex-direction:column;align-items:center;gap:.3rem;font-size:.68rem;color:var(--ink2);min-width:1.6rem}
.step i{width:.95rem;height:.95rem;border-radius:50%;background:#fff;border:1px solid #d6dae0;display:block}
.step.on i{border:.27rem solid var(--blue)}
.step.on{color:var(--ink);font-weight:600}
.radios{display:flex;gap:1.1rem;flex-wrap:wrap}
.radio{display:flex;align-items:center;gap:.35rem;font-size:.8rem}
.radio i{width:.95rem;height:.95rem;border-radius:50%;border:1px solid #cfd4da;display:block;background:#fff}
.radio.on i{border:.27rem solid var(--blue)}
.row{display:flex;align-items:center;justify-content:space-between;background:#fff;border-radius:.3rem;padding:.8rem;margin-top:.45rem;font-size:.85rem;width:100%;text-align:left}
.row:first-of-type{margin-top:0}
.row .r{display:flex;align-items:center;gap:.4rem;color:var(--ink2);font-size:.75rem}
.row .r .ico{width:1rem;height:1rem}
.tag{font-size:.65rem;color:var(--blue);background:var(--blue-l);padding:.1rem .35rem;border-radius:.2rem}
.plain{background:var(--card);border-radius:.4rem;padding:.9rem .8rem;margin-bottom:.7rem;display:flex;justify-content:space-between;font-size:.85rem;width:100%;text-align:left}
.plain .r{color:var(--ink2)}
/* ── 관리자 페이지 (실제: my.brobotics.kr 웹 화면) ── */
#admin{background:#fff}
.ad-logo{font-family:'Hanna',sans-serif;font-size:1.25rem;color:#2cc2b5;letter-spacing:-.01em}

.ad-login{flex:1;display:flex;flex-direction:column;align-items:center;padding:3.2rem 1.4rem 0}

.ad-field{position:relative;width:100%;margin-bottom:1rem}

.ad-field label{position:absolute;left:.7rem;top:-.5rem;background:#fff;padding:0 .3rem;font-size:.7rem;color:var(--ink2)}
.ad-row{width:100%;display:flex;justify-content:space-between;align-items:center;font-size:.85rem;margin:.2rem 0 1.4rem}
.ad-row label{display:flex;align-items:center;gap:.4rem}
.ad-row input{width:1.05rem;height:1.05rem}
.ad-btn{width:100%;height:3rem;background:var(--blue);color:#fff;border-radius:.25rem;font-size:.95rem}
.ad-top{height:3.6rem;flex:none;display:flex;align-items:center;justify-content:center;position:relative;border-bottom:1px solid #eceef1}
.ad-top .iconbtn{position:absolute;left:.7rem}
.ad-top .out{position:absolute;right:.9rem;font-size:.72rem;color:var(--ink2)}
.ad-body{flex:1;overflow:auto;padding:2.2rem 1.4rem 1.4rem}

.ad-modes{display:grid;grid-template-columns:1fr 1fr;gap:.9rem}
.ad-modes button{height:4.4rem;border:1.5px solid #dfe3e8;border-radius:.6rem;color:var(--blue);font-family:'Hanna',sans-serif;font-size:1.1rem;box-shadow:0 2px 6px rgba(0,0,0,.05)}
.ad-modes button.fill{background:var(--blue);border-color:var(--blue);color:#fff}
.ad-pick{position:relative;width:min(62%,13rem);margin:1rem auto 0;border-radius:.6rem;overflow:hidden;aspect-ratio:10/16;border:.3rem solid #e9ecef;cursor:pointer}
.ad-pick .tagb{position:absolute;top:.5rem;left:50%;transform:translateX(-50%);z-index:2;background:#fff;border:1px solid var(--blue);color:var(--blue);font-size:.7rem;padding:.15rem .6rem;border-radius:.25rem}
.nm-card{background:#fff8e6;border-radius:.8rem;padding:.9rem;margin-bottom:1.4rem;box-shadow:0 0 0 1px #f3dfb0 inset}
.nm-card > b{font-family:'Hanna',sans-serif;font-weight:400;font-size:1.1rem}
.nm-pick{display:flex;gap:.5rem;margin:.6rem 0}
.nm-pick button{flex:1;display:flex;flex-direction:column;align-items:center;gap:.2rem;padding:.4rem;border-radius:.6rem;background:#fff;border:2px solid #eee4cf;font-size:.85rem;font-weight:700}
.nm-pick button .food{width:4rem}
.nm-pick button.on{border-color:#e9774c;background:#fff1e8}
.nm-inp{height:2.8rem;font-size:1rem;font-weight:700}
.nm-step{display:flex;gap:.6rem;align-items:flex-start;margin:.8rem 0 .4rem}
.nm-step > span{flex:none;width:1.7rem;height:1.7rem;border-radius:50%;background:#e9774c;color:#fff;font-weight:800;display:grid;place-items:center;font-size:.85rem}
.nm-step.ok > span{background:#2cc2b5}
.nm-step > div{flex:1;line-height:1.35}
.nm-step b{font-size:.95rem}
.nm-step small{display:block;font-size:.75rem;color:var(--ink2);margin-top:.15rem;word-break:keep-all}
.nm-btn{flex:none;align-self:center;background:#e9774c;color:#fff;border-radius:1rem;padding:.4rem .8rem;font-size:.78rem;font-weight:700}
.nm-step.ok .nm-btn{background:#fff;color:var(--ink3);box-shadow:0 0 0 1px #e3e6ea inset}
.roam-done{position:absolute;left:1rem;right:1rem;bottom:calc(env(safe-area-inset-bottom) + 3.4rem);z-index:5;height:3.6rem;border-radius:1rem;background:#2cc2b5;color:#fff;font-weight:800;font-size:1.25rem;box-shadow:0 .3rem 1rem rgba(0,0,0,.15)}
.roam-links{position:absolute;left:1rem;right:1rem;bottom:calc(env(safe-area-inset-bottom) + 3.4rem);}

.roam-links{display:grid;grid-template-columns:1fr 1fr;gap:.6rem;z-index:5}
.roam-links a{display:flex;flex-direction:column;align-items:center;gap:.15rem;padding:.9rem .6rem;border-radius:.9rem;background:rgba(255,255,255,.95);color:#2b2f36;text-decoration:none;font-weight:800;font-size:1.05rem;box-shadow:0 .3rem 1rem rgba(0,0,0,.15)}
.roam-links a small{font-weight:400;font-size:.7rem;color:#8a8f98}
.snd-test{display:grid;grid-template-columns:repeat(3,1fr);gap:.4rem}
.snd-test .btn{height:2.6rem;font-size:.85rem}
.snd-help small{display:block;font-size:.7rem;color:var(--ink2);margin-top:.15rem}
.snd-help{padding-left:1.2rem;display:flex;flex-direction:column;gap:.35rem;font-size:.8rem;line-height:1.5;color:var(--ink)}
.snd-tip{margin-top:.7rem;font-size:.75rem;color:var(--ink2);background:#fff8e6;border-radius:.5rem;padding:.55rem .7rem;line-height:1.5}
.snd-warn{margin-top:.5rem;padding:.6rem .7rem;border-radius:.5rem;background:#fdecec;color:#c62828;font-weight:700;line-height:1.55}

.nm-links{display:grid;grid-template-columns:1fr 1fr;gap:.5rem;margin:.7rem 0 .2rem}
.nm-links a{display:flex;flex-direction:column;align-items:center;text-align:center;gap:.1rem;padding:.7rem .6rem;border-radius:.6rem;background:#fff;box-shadow:0 0 0 1.5px #f3dfb0 inset;color:var(--ink);text-decoration:none;font-weight:800;font-size:.82rem}
.nm-links a small{font-weight:400;font-size:.66rem;color:var(--ink3);margin:0}
.nm-ok{font-size:.8rem;color:#178f86;font-weight:700;margin-top:.4rem}
.qrbox{width:min(70%,14rem);margin:.6rem auto 0;background:#fff}

.lic{display:flex;flex-direction:column;gap:.6rem;margin-top:.6rem;text-align:left}

.lic span{color:var(--ink2);font-size:.72rem}
.lic small{color:var(--ink3);font-size:.68rem}
.grp-head{display:flex;justify-content:flex-end;gap:.35rem;margin-bottom:.6rem}
.grp-head .btn{height:2.1rem;padding:0 1rem;font-size:.8rem;font-weight:700}
.grp-tabs{display:grid;grid-template-columns:repeat(5,1fr);border-bottom:1px solid #e3e6ea;margin-bottom:.8rem}
.grp-tabs button{height:2.3rem;font-size:.9rem;color:var(--ink2)}
.grp-tabs button.on{color:var(--ink);font-weight:700;box-shadow:inset 0 -2px 0 var(--ink)}
.grp-dests{display:grid;grid-template-columns:repeat(5,1fr);gap:.35rem}

const vidURL={roam:null, promo:null};
function idb(){ return new Promise((ok,no)=>{ try{ const r=indexedDB.open('srv_media',1); r.onupgradeneeded=()=>r.result.createObjectStore('v'); r.onsuccess=()=>ok(r.result); r.onerror=()=>no(r.error); }catch(e){ no(e); } }); }
async function vidPut(mode, blob){ const db=await idb(); return new Promise((ok,no)=>{ const t=db.transaction('v','readwrite'); t.objectStore('v').put(blob, mode); t.oncomplete=ok; t.onerror=()=>no(t.error); }); }
async function vidDel(mode){ try{ const db=await idb(); db.transaction('v','readwrite').objectStore('v').delete(mode); }catch(e){} }

let voices=[];
function loadVoices(){ try{ voices = speechSynthesis.getVoices().filter(v=>/^ko/i.test(v.lang)); }catch(e){ voices=[]; } }
if('speechSynthesis' in window){ loadVoices(); speechSynthesis.onvoiceschanged = loadVoices; }
// "3번" → "삼번" (TTS가 "세 번"으로 읽지 않도록 한자어 수로 바꿔 읽기)
const SINO=['','일','이','삼','사','오','육','칠','팔','구'];
function sino(n){ n=+n; if(!n) return '영'; if(n>=10000) return String(n);
  const d=[Math.floor(n/1000)%10, Math.floor(n/100)%10, Math.floor(n/10)%10], u=['천','백','십'];
  return d.map((x,i)=> x ? (x>1?SINO[x]:'')+u[i] : '').join('') + SINO[n%10]; }
function sayNum(t){ return String(t).replace(/(\d+)(\s*)번/g, (_,d,sp)=>sino(d)+sp+'번'); }
function speak(text, rate, force){
  if(!text || !('speechSynthesis' in window)) return;
  if(!S.tts && !force) return;
  if(paused && !force) return;   // 일시정지 중엔 말하지 않음
  try{
    const u = new SpeechSynthesisUtterance(sayNum(text));
    u.lang='ko-KR'; u.rate = (rate||1)*S.ttsRate; u.volume = S.volume;
    if(!voices.length) loadVoices();
    const v = S.voice ? voices.find(v=>v.name===S.voice) : null; if(v) u.voice=v;   // 목소리를 고른 경우만 지정 (안드로이드에서 지정하면 조용히 실패하는 경우가 있어요)
    u.onerror = ev=>{ ttsLog='오류: '+(ev.error||'알 수 없음'); if(!u.__retry && ev.error!=='interrupted' && ev.error!=='canceled'){ const u2=new SpeechSynthesisUtterance(u.text); u2.lang='ko-KR'; u2.rate=u.rate; u2.volume=u.volume; u2.__retry=1; window.__utt2=u2; try{ speechSynthesis.speak(u2); }catch(e){} } };
    u.onstart = ()=>{ ttsLog='말하는 중 ✓'; };
    window.__utt = u;   // 안드로이드 크롬: 참조가 없으면 말하는 도중에 사라지는 문제 방지
    // 안드로이드 크롬: 끊자마자 새로 말하면 조용히 사라져서, 말하는 중일 때만 끊고 잠깐 뒤에 말해요
    if(speechSynthesis.speaking || speechSynthesis.pending){ speechSynthesis.cancel(); setTimeout(()=>{ try{ speechSynthesis.speak(u); }catch(e){} }, 80); }
    else speechSynthesis.speak(u);
    if(speechSynthesis.paused) speechSynthesis.resume();
  }catch(e){}
}

/* 폰 브라우저는 화면을 터치하기 전엔 소리를 막아요 → 첫 터치 때 알림음·음성을 미리 깨워 둬요 */
let audioReady=false;
function unlockAudio(){
  try{ actx = actx || new (window.AudioContext||window.webkitAudioContext)(); if(actx.state!=='running') actx.resume();
    if(!audioReady){ const b=actx.createBuffer(1,1,22050), src=actx.createBufferSource(); src.buffer=b; src.connect(actx.destination); src.start(0); } }catch(e){}
  if(!audioReady && 'speechSynthesis' in window){ try{ const u=new SpeechSynthesisUtterance(' '); u.volume=0; u.lang='ko-KR'; window.__utt0=u; speechSynthesis.speak(u); }catch(e){} }
  audioReady=true;
}
['pointerdown','touchend','click','keydown'].forEach(ev=>addEventListener(ev, unlockAudio, {capture:true, passive:true}));
document.addEventListener('visibilitychange', ()=>{ if(!document.hidden && actx && actx.state!=='running') try{ actx.resume(); }catch(e){} });
function playSong(){
  stopSong();
  try{
    actx = actx || new (window.AudioContext||window.webkitAudioContext)();
    if(actx.state==='suspended') actx.resume();
    const N={G4:392,A4:440,B4:493.9,C5:523.3,D5:587.3,E5:659.3,F5:698.5,G5:784};
    const seq=[['G4',.75],['G4',.25],['A4',1],['G4',1],['C5',1],['B4',2],
      ['G4',.75],['G4',.25],['A4',1],['G4',1],['D5',1],['C5',2],
      ['G4',.75],['G4',.25],['G5',1],['E5',1],['C5',1],['B4',1],['A4',2],
      ['F5',.75],['F5',.25],['E5',1],['C5',1],['D5',1],['C5',2.5]];
    const beat=.42; let t=actx.currentTime+.05; const g=actx.createGain(); g.gain.value=.18*S.volume; g.connect(actx.destination);
    const oscs=[];
    for(const [n,d] of seq){
      const o=actx.createOscillator(), e=actx.createGain(); o.type='triangle'; o.frequency.value=N[n];
      e.gain.setValueAtTime(0,t); e.gain.linearRampToValueAtTime(1,t+.02); e.gain.exponentialRampToValueAtTime(.01,t+d*beat*.95);
      o.connect(e); e.connect(g); o.start(t); o.stop(t+d*beat); oscs.push(o); t+=d*beat;
    }
    songStop=()=>{ oscs.forEach(o=>{try{o.stop()}catch(e){}}); g.disconnect(); };
  }catch(e){}
}
// 출발 알림음: 파#↗라↗레 ↘솔# (실제 서빙로봇 출발음)
var lastChime=0;
function chime(){
  lastChime=Date.now();
  try{
    actx = actx || new (window.AudioContext||window.webkitAudioContext)();
    if(actx.state==='suspended') actx.resume();
    // 폰 스피커에서도 들리게: 음높이는 그대로, 한 옥타브 위 배음을 섞고 조금 더 크게 (겹쳐도 찢어지지 않게 컴프레서)
    const comp=actx.createDynamicsCompressor(); comp.connect(actx.destination);
    const g=actx.createGain(); g.gain.value=.45*S.volume; g.connect(comp);
    let t=actx.currentTime+.03;
    for(const f of [369.99, 440, 587.33, 415.30]){
      for(const [mul,type,lv] of [[1,'triangle',1],[2,'sine',.5]]){
        const o=actx.createOscillator(), e=actx.createGain(); o.type=type; o.frequency.value=f*mul;
        e.gain.setValueAtTime(0,t); e.gain.linearRampToValueAtTime(lv,t+.015); e.gain.exponentialRampToValueAtTime(.001,t+.55);
        o.connect(e); e.connect(g); o.start(t); o.stop(t+.6);
      }
      t+=.17;
    }
  }catch(e){}
}
function stopSong(){ if(songStop){ songStop(); songStop=null; } }

const cvs=$('#confetti'), cctx=cvs.getContext('2d'); let parts=[], confOn=false, raf=0;
function sizeCanvas(){ const f=$('#frame'); cvs.width=(f?f.clientWidth:innerWidth)*devicePixelRatio; cvs.height=(f?f.clientHeight:innerHeight)*devicePixelRatio; }

var partyOn=false;
function updateConfetti(){
  const want = partyOn || (current==='home' && kind==='birthday') || (trip && trip.kind==='birthday' && !trip.returning && (current==='moving'||current==='arrive'));
  cvs.style.zIndex = partyOn ? 90 : 40;   // 영업 완료 축하 때는 축하 화면 위로 날려요
  if(want===confOn) return; confOn=want;
  if(confOn){ parts=Array.from({length:70},()=>newPart(true)); loop(); } else { cancelAnimationFrame(raf); cctx.clearRect(0,0,cvs.width,cvs.height); }
}
function newPart(any){ const cols=['#f48fb1','#90caf9','#64b5f6','#f8bbd0','#ef9a9a','#b39ddb'];
  return {x:Math.random()*cvs.width, y:any?Math.random()*cvs.height:-20, vy:(.4+Math.random()*.9)*devicePixelRatio, vx:(Math.random()-.5)*.6,
    r:Math.random()*6.28, vr:(Math.random()-.5)*.08, w:(4+Math.random()*6)*devicePixelRatio, h:(2+Math.random()*4)*devicePixelRatio, c:cols[Math.random()*cols.length|0]}; }
function loop(){
  cctx.clearRect(0,0,cvs.width,cvs.height);
  for(const p of parts){ p.y+=p.vy; p.x+=p.vx; p.r+=p.vr; if(p.y>cvs.height+20) Object.assign(p,newPart(false));
    cctx.save(); cctx.translate(p.x,p.y); cctx.rotate(p.r); cctx.fillStyle=p.c; cctx.globalAlpha=.85; cctx.fillRect(-p.w/2,-p.h/2,p.w,p.h); cctx.restore(); }
  raf=requestAnimationFrame(loop);
}

function assign(n){

  slots[active]=n;
  const nextEmpty = slots.findIndex((t,i)=>t==null && i>active);
  const anyEmpty = slots.findIndex(t=>t==null);
  active = nextEmpty>=0 ? nextEmpty : anyEmpty>=0 ? anyEmpty : active;
  renderHome();
}

    if(v==='del') typed=typed.slice(0,-1); else if(v==='ok'){ if(typed){ assign(+typed); typed=''; } } else if(typed.length<2) typed+=v;

$('#soupBtn').onclick=()=>{ soup=!soup; toast(soup?'국물 모드: 천천히 조심해서 갈게요':'국물 모드를 껐어요'); renderHome(); };
$('#sendBtn').onclick=()=>{

/* ═════════ 운행(이동 → 도착 → 다음 → 복귀) ═════════ */
let trip=null, autoT=null, autoLeft=0, autoStart=0, pauseT=null, arrT=null, repT=null;
let departT=null;
let moveT=null;
function clearTimers(){ clearTimeout(autoT); clearInterval(pauseT); clearInterval(arrT); clearTimeout(departT); clearInterval(moveT); autoT=pauseT=arrT=departT=moveT=null; }
function speedNow(){ if(!trip) return S.speedNormal; if(trip.returning) return S.speedReturn; return trip.soup ? S.speedSoup : S.speedNormal; }

function startTrip(k, stops){
  trip = {kind:k, stops, i:0, soup, slots:slots.slice(), returning:false};
  goMove();
}
function stopNow(){ if(trip.returning){ if((trip.kind==='guide'||trip.kind==='guideStart') && S.guideStart) return {type:'base', label:S.guideStart+'번 대기'}; return {type:'base', label:S.baseName}; } return trip.stops[trip.i]; }
function goMove(){

  else { num.classList.add('text'); num.textContent=st.label; nm.textContent = st.type==='kitchen' ? (st.store==='snack' ? '' : '주방') : ''; }

  if(trip.kind==='guide' && !trip.returning && trip.party){ const c=$('#mvChip'); c.style.display=''; c.textContent=`${trip.party.reserved?'예약':'방문'} · ${trip.party.count}명`; }
  $('#mvHello').textContent = trip.kind==='birthday' && !trip.returning ? '생일 축하합니다!' : trip.kind==='guide' && !trip.returning ? '저를 따라오세요' : '';
  const chip=$('#mvChip');
  if(trip.soup && !trip.returning){ chip.style.display=''; chip.textContent='🍲 국물 모드 · 천천히 이동해요'; } else chip.style.display='none';
  const rest = trip.returning ? [] : trip.stops.slice(trip.i+1).map(s=>s.type==='table'?s.num:s.label);

  // 수동 도착일 때: 이동 중·출발지로 갈 때 모두 「도착했어요」 버튼
  // 서빙(안내 제외)은 일시정지 없음 → 도착 버튼은 항상 보여 줌
  const noPause = trip.kind!=='guide' && trip.kind!=='guideStart' && trip.kind!=='promoGo';   // 홍보 장소로 갈 땐 터치하면 일시정지
  $('#moving').classList.toggle('nopause', noPause);

  show('moving');
  // 출발 안내

  else if(trip.kind==='promoGo' || trip.kind==='kitchen'){ hush(); chime(); }   // 홍보 시작·주방 가기: 출발 알림음만
  else if(trip.kind==='guide'){ chime(); departT=setTimeout(()=>{ if(current==='moving') speak(S.ments.guide); }, 1000); }   // 안내 출발: 알림음 뒤에 「저를 따라오세요」
  else if(trip.kind==='guideStart') speak('안내 출발지로 이동합니다.');
  else { // 실제 서빙로봇처럼: 출발 알림음(파#·라·레·솔#) 뒤에 출발 멘트
    chime();
    const say = fill(S.ments.depart, {'목적지': st.type==='table' ? tableLabel(st.num) : st.label});
    departT = setTimeout(()=>{ if(current==='moving') speak(say); }, 1000);
  }
  // 자동 도착
  if(S.arriveMode!=='manual'){ autoLeft = (+S.arriveMode) * 1000 * (0.7/speedNow()); armAuto(); }
}
function armAuto(){ if(S.arriveMode==='manual') return; autoStart=Date.now(); autoT=setTimeout(arrived, autoLeft); }

/* 일시정지 */
var paused=false;   // var: speak()가 먼저 불려도 안전하게
$('#moving').addEventListener('click', ()=>{ if(!paused && !$('#moving').classList.contains('nopause')) pause(); });
$('#mvDone').addEventListener('click', e=>{ e.stopPropagation(); if(!paused && trip) arrived(); });
function pause(){
  paused=true; hush(); clearTimeout(departT); departT=null;
  if(autoT){ clearTimeout(autoT); autoT=null; autoLeft=Math.max(0, autoLeft-(Date.now()-autoStart)); }
  const ret = trip.returning;
  $('#pzTitle').textContent='일시정지';
  $('#pzActs').innerHTML = `<button class="btn btn-fill" data-pz="arrive">도착했어요</button>
    <button class="btn btn-out" data-pz="resume">다시 출발</button>
    ${ret?'':`<button class="btn btn-gray" data-pz="cancel">${trip.kind==='guide'?'안내':'서빙'} 취소하고 복귀</button>`}`;
  $('#pause').classList.add('on');
  let left=S.pauseTime; const msg=$('#pzMsg');
  const draw=()=> msg.textContent = S.pauseTime ? `${left}초 후 다시 출발해요` : '버튼을 눌러 주세요';
  draw(); clearInterval(pauseT);
  if(S.pauseTime) pauseT=setInterval(()=>{ left--; draw(); if(left<=0) resume(); },1000);
}
function closePause(){ paused=false; clearInterval(pauseT); pauseT=null; $('#pause').classList.remove('on'); }
function resume(){ closePause(); speak('다시 출발할게요.'); armAuto(); }
$('#pzActs').addEventListener('click', e=>{
  const b=e.target.closest('[data-pz]'); if(!b) return;

  else if(a==='displayBack'){ closePause(); stopDisplay(); goServe(); }

    html = `<div class="arr-big">${esc(st.label)}</div><div class="arr-msg">주방에 도착했어요.<br>음식을 실은 후 로봇 보내기 버튼을 눌러주세요</div>`

    speak(S.ments.collect);

      `<div class="arr-msg">지정된 트레이의 음식을 내리신 후<br>로봇 보내기 버튼을 눌러주세요</div>` + trayList(st.trays, t=>`${t}`) +
      (k==='birthday'?`<button class="btn btn-out arr-song" id="songBtn" style="padding:0 1.2rem">🎵 축하 노래 다시 듣기</button>`:'');
    if(k==='birthday'){ speak(S.ments.birthday); setTimeout(()=>{ if(current==='arrive') playSong(); }, 2600); }
    else { const P=bizMine(), nf=P && st.num===P.table && P.items.find(i=>isNew(i));

function next(){

function finishTrip(){
  { const t=trip; setTimeout(()=>{ try{ bizTrip(t); }catch(e){} }, 60); }   // 기존 완료 알림 뒤에 미션 결과를 보여 줘요

  else { if(kind==='birthday' && hadStops) kind='serve'; renderHome(); show('home'); }
  if(hadStops) toast(k==='guide' ? `안내 완료! ${waitPlace()}로 돌아왔어요` : `서빙 완료! ${waitPlace()}로 돌아왔어요 🎉`);
}

function contentHTML(c, img, editable){
  const B = BGS.find(b=>b.id===c.bg) || BGS[0];
  const ph = (cls, key, txt, phTxt)=> editable
    ? `<div class="${cls} ph" contenteditable="true" data-field="${key}" data-ph="${phTxt}">${esc(txt)}</div>`
    : (txt ? `<div class="${cls}">${esc(txt)}</div>` : '');
  const photoBg = c.layout==='m1' && img && img.src; const fg = photoBg ? '#fff' : B.fg, sub = photoBg ? '#fff' : B.sub;
  const t1 = ph('t1','t1',c.t1,'텍스트 입력'), t2 = ph('t2','t2',c.t2,'텍스트 입력');
  const pic = (cover)=> !img ? (editable?`<div class="imgbox" style="width:70%;aspect-ratio:1;border:2px dashed rgba(127,127,127,.5);border-radius:.8em;color:inherit;opacity:.6;font-size:1em">이미지 없음</div>`:'')
    : img.food!=null ? `<div class="sprite" style="background-position:${spritePos(img.food)}"></div>`
    : img.video ? `<video src="${img.video}" autoplay muted loop playsinline></video>`
    : `<img src="${img.src}" alt="">`;
  let inner='';
  const hint = `<div class="hint2" style="color:${sub}">화면을 터치하면 일시정지해요</div>`;
  switch(c.layout){
    case 'm1':
      inner = img ? `<div class="imgbox" style="position:absolute;inset:0;${img.food!=null?'padding:30% 18% 22%':''}">${pic()}</div>${img.food==null?'<div class="shade"></div>':''}
        <div class="layer" style="position:absolute;top:9%;color:${fg}">${t1}${t2}</div>`
        : `<div class="layer" style="color:${fg}">${t1}${t2}</div>`;
      break;
    case 'm2':
      inner = `<div class="layer" style="color:${fg};height:100%;justify-content:center;gap:1.2em;padding:8% 0 12%">${t1}
        <div class="imgbox ${img&&img.src?'':'contain'}" style="width:76%;flex:0 1 auto;aspect-ratio:1;max-height:44%;border-radius:1em">${pic()}</div>
        <div style="color:${sub}">${t2}</div></div>`;
      break;
    case 'm3':
      inner = `<div class="imgbox" style="position:absolute;top:0;left:0;right:0;height:52%">${pic()}</div>
        <div class="layer" style="position:absolute;top:56%;color:${fg}">${t1}<div style="color:${sub}">${t2}</div></div>`;
      break;
    case 'm4':
      inner = `<div class="layer" style="position:absolute;top:8%;color:${fg}">${t1}<div style="color:${sub}">${t2}</div></div>
        <div class="imgbox" style="position:absolute;bottom:0;left:0;right:0;height:50%">${pic()}</div>`;
      break;
    case 'm5':
      inner = `<div class="layer" style="color:${fg};gap:1.4em"><div class="imgbox contain" style="width:42%;aspect-ratio:1;border-radius:.8em">${pic()}</div>${t1}<div style="color:${sub}">${t2}</div></div>`;
      break;
    case 'poster':   // 포스터 한 장을 잘리지 않게 꽉 채움 (남는 곳은 포스터를 흐리게 깔아 채움) · 글자 없음
      inner = img && img.video ? `<video class="pimg" src="${img.video}" autoplay muted loop playsinline style="background:#000"></video>`
        : img && img.src ? `<div class="pbg" style="background-image:url('${img.src}')"></div><img class="pimg" src="${img.src}" alt="">`
        : img ? `<div class="imgbox contain" style="width:80%;aspect-ratio:1">${pic()}</div>`
        : `<div class="layer" style="color:${sub};opacity:.7">포스터 이미지를 넣어 주세요<br><small>(1200×1760 · 세로 2:3)</small></div>`;
      break;
    default:
      inner = `<div class="layer" style="color:${fg};gap:1.2em">${t1}<div style="color:${sub}">${t2}</div></div>`;
  }
  const hideHint = c.layout==='m4' || String(c.t2||'').includes('화면을 터치하면 일시정지');
  return `<div class="cv ${c.layout==='poster'?'poster':''}" style="background:${B.bg}">${inner}${hideHint?'':hint}</div>`;
}

/* ═════════ 영업 미션 (한 가족 = 로봇 1대 = 테이블 1개)
   강사가 태블릿마다 안내 출발지(가족 1~4 대기)를 겹치지 않게 고르면 그게 가족 번호가 돼요.
   네 태블릿은 연결되어 있지 않지만, 「영업 번호 + 가족 번호」로 똑같은 규칙을 계산해서 테이블·메뉴가 서로 겹치지 않아요.
   ①자리 안내 → ②홍보 → ③서빙(여러 가게에서 싣기) → ④퇴식 → ⑤이벤트(시간 남는 가족) */
const PARTY=[0,2,2,3,3,3,2,4,3];      // 맵 테이블별 손님 수 (1~8번)
const SOUP=[3,6,8,11,13,14];          // 국물 메뉴: 라면·된장찌개·냉면·라멘·짬뽕·마라탕
const BIZ_MAX=4;
const BSTEPS=[{id:'promo',e:'📣',t:'홍보'},{id:'serve',e:'🍽️',t:'서빙'},{id:'event',e:'🎉',t:'이벤트'},{id:'collect',e:'🥣',t:'퇴식'}];   // 손님이 먹는 동안 리뷰 이벤트 → 다 먹으면 퇴식
var BZ={round:1, fam:null, done:{}, note:{}, loaded:{}, t0:0, rating:[]};

function prng(seed){ return ()=>{ seed=seed+0x6D2B79F5|0; let t=Math.imul(seed^seed>>>15,1|seed); t=t+Math.imul(t^t>>>7,61|t)^t; return ((t^t>>>14)>>>0)/4294967296; }; }
function bizPlan(round){
  // 영업 1·2, 영업 3·4는 「신메뉴 후보」 2개를 같이 써요 → 한 번 지은 신메뉴 이름이 두 영업 동안 유지돼요
  const pair=Math.ceil(round/2), rk=prng(20261009 + pair*7919);
  const mixK=a=>{ for(let i=a.length-1;i>0;i--){ const j=rk()*(i+1)|0; [a[i],a[j]]=[a[j],a[i]]; } return a; };
  const all=mixK([...Array(20).keys()]), keeps=[0,1,2,3].map(()=>all.splice(0,2));
  const r=prng(20261009 + round*977);
  const fams=[0,1,2,3].map(f=>{
    const table = round===1 ? f+5 : (r()<.5 ? f+5 : f+1);          // 가족 n → (n+4)번 또는 n번 · 영업 1은 가까운 아래 줄
    const party = PARTY[table];
    r();   // (예전 「하나 더!」 자리 · 다른 값이 바뀌지 않게 한 번 뽑아 둬요)
    return {table, party, extra:0, count:party, wantSoup:r()<.6, bday:(r(), false), keep:keeps[f]};   // 생일은 미션 아님 · 선택
  });
  const mix=a=>{ for(let i=a.length-1;i>0;i--){ const j=r()*(i+1)|0; [a[i],a[j]]=[a[j],a[i]]; } return a; };
  const used=new Set(keeps.flat());
  const soups=mix(SOUP.filter(i=>!used.has(i))), rest=mix([...Array(20).keys()].filter(i=>!SOUP.includes(i) && !used.has(i)));
  fams.forEach(F=>{ F.items=F.keep.slice();
    if(F.wantSoup && !F.items.some(i=>SOUP.includes(i)) && F.items.length<F.count && soups.length) F.items.push(soups.pop());
    while(F.items.length<F.count) F.items.push(rest.length?rest.pop():soups.pop());
    F.items.sort((a,b)=>a-b); F.soup=F.items.some(i=>SOUP.includes(i)); });
  return fams;
}
function bizMine(){ return BZ.fam==null ? null : bizPlan(BZ.round)[BZ.fam]; }

setInterval(()=>{ let P, cur; try{ P=bizMine(); cur=bizCur(); }catch(e){ return; } if(!P||!cur||cur.id!=='event') return;
  const mk=BZ.mk||{}, st=stageStart('event'); if(!st || (mk.review||0)>st) return;   // 서빙을 마치고 대기 장소에 오면 8초쯤 뒤 리뷰 도착
  if(Date.now()-st < 8000 || current==='moving' || current==='arrive' || $('#modalWrap').classList.contains('on') || $('#party').classList.contains('on')) return;

  bizMark('review'); ding(); speak(`띵동! ${P.table}번 테이블 손님이 리뷰를 남겼어요.`); alertPop('review'); }, 1000);
// 실제 앱에서 한 일을 보고 미션을 체크해요
function bizEvent(ev){
  const P=bizMine(); if(!P) return; const cur=bizCur(); if(!cur) return;
  const T=P.table, turn=()=>toast(`지금은 ${cur.e} ${cur.t} 차례예요`, true);
  if(ev.kind==='guide'){ return; }   // 안내하기·돌아다니기는 미션 밖 (자유롭게 써 봐요)
  else if(ev.kind==='promoArrive'){ if(cur.id!=='promo') return turn(); if(ev.table!==T) return toast(`홍보 장소는 ${T}번 테이블이에요!`, true); bizOk('promo'); }
  else if(ev.kind==='serve' || ev.kind==='birthday'){
    if(cur.id==='event'){ if(!ev.tables.includes(T)) return toast(`간식은 우리 테이블 ${T}번으로 가져가요!`, true);
      if(!(((BZ.mk||{}).snackLoad||0)>stageStart('event'))) return toast('간식 매대에서 간식을 먼저 실어요', true);
      return bizOk('event'); }
    if(cur.id!=='serve') return turn(); if(!ev.tables.includes(T)) return toast(`주문한 테이블은 ${T}번이에요!`, true);
    const n=[]; if(P.soup && !ev.soup) n.push('🍲 국물 메뉴였는데 국물 모드를 안 켰어요'); if(P.bday && ev.kind!=='birthday') n.push('🎂 생일 손님인데 케이크 아이콘을 안 눌렀어요');
    if(P.items.some(i=>!BZ.loaded[i])) n.push('🧾 주문서에서 싣기 체크를 다 안 했어요');
    bizOk('serve', n); }
  else if(ev.kind==='collect'){ if(cur.id!=='collect') return turn(); if(!ev.tables.includes(T) || !ev.dish) return toast(`${T}번 테이블 그릇을 식기 반납대까지 가져가요!`, true); bizOk('collect'); }
  else if(ev.kind==='roamStart'){ return; }
  else if(ev.kind==='roamEnd'){ if(cur.id==='event' && ((BZ.mk||{}).roamGo||0)>stageStart('event')) bizMark('roamEnd'); }   // 다 돌아다니면 → 간식 매대로
}
function bizTrip(t){
  if(!t || t.mission || t.canceled) return;
  const tables=(t.stops||[]).filter(x=>x.type==='table').map(x=>x.num);
  if(t.kind==='guide') bizEvent({kind:'guide', table:tables[0], count:t.party&&t.party.count});
  else if(t.kind==='serve' || t.kind==='birthday') bizEvent({kind:t.kind, tables, soup:!!t.soup});
  else if(t.kind==='collect') bizEvent({kind:'collect', tables, dish:(t.stops||[]).some(x=>x.type==='dish')});
  else if(t.kind==='roam') bizEvent({kind:'roamEnd'});   // 돌아다니기 → 출발지로 보내기 → 도착
}
// 강사님 메뉴로 바꿀 때: 하던 이동·홍보·돌아다니기를 모두 멈추고 서빙 화면으로 (예전 이동 화면이 남지 않게)
function bizHalt(){ try{ clearTimers(); stopSong(); hush(); }catch(e){}
  try{ if($('#rpause').classList.contains('on')) roamClose(); }catch(e){} try{ closePause(); }catch(e){}
  if(roamRun||promoRun||current==='display'){ roamRun=false; promoRun=false; try{ stopDisplay(); }catch(e){} }
  trip=null; paused=false; kind='serve'; soup=false; kitPick=[]; resetSlots(); renderHome(); show('home'); }
function bizTeacher(){
  // 서빙 번호와 가족 번호를 한 화면에서 골라 「적용」 (서빙 1 = 영업 처음부터 · 서빙 2~4 = 서빙만)
  let sv=BZ.fam==null ? 1 : (BZ.xs||1), fm=BZ.fam==null ? null : BZ.fam+1;
  const draw=()=>{ $('#modal').innerHTML = `<button class="iconbtn close" data-m="x" aria-label="닫기"><svg class="ico" viewBox="0 0 24 24"><path d="M6 6l12 12M18 6 6 18"/></svg></button>
    <h4>👩‍🏫 강사님 메뉴</h4>
    <div class="tm-lb">서빙 번호 <small>같은 번호끼리 테이블·메뉴가 안 겹쳐요</small></div>
    <div class="tm-g">${[1,2,3,4].map(n=>`<button class="${sv===n?'on':''}" data-tms="${n}">서빙 ${n}${n===1?'<small>영업 처음부터</small>':''}</button>`).join('')}</div>
    <div class="tm-lb">가족 번호 <small>= ○번 대기 장소 · 태블릿끼리 겹치지 않게</small></div>
    <div class="tm-g">${[1,2,3,4].map(n=>`<button class="${fm===n?'on':''}" data-tmf="${n}" style="--c:${FAM_COL[n-1]}">가족 ${n}</button>`).join('')}</div>
    <div class="two" style="margin-top:1rem"><button class="btn btn-gray" data-m="x">취소</button><button class="btn btn-fill" data-m="ok" ${fm?'':'disabled'}>서빙 ${sv} · 가족 ${fm||'?'} 적용</button></div>`; };
  draw(); openModal();
  $('#modal').onclick=e=>{ const b=e.target.closest('[data-tms],[data-tmf],[data-m]'); if(!b) return;
    if(b.dataset.tms){ sv=+b.dataset.tms; draw(); return; }
    if(b.dataset.tmf){ fm=+b.dataset.tmf; draw(); return; }
    if(b.dataset.m==='x'){ closeModal(); return; }
    if(!fm) return; closeModal(); bzOpen=false; bizHalt();
    const famChanged = BZ.fam!==fm-1;
    if(famChanged || sv===1){ BZ.round=1; S.guideStart=fm; save(); bizStart(fm-1); }
    if(sv===1){ BZ.go=0; saveBZ(); renderStrip(); return; }   // 서빙 1 = 영업 처음부터 → 미션 화면부터 (같은 가족이면 지어 둔 이름이 칸에 남아 있어요)
    BZ.go=BZ.go||Date.now(); saveBZ(); bizServeMore(sv); toast(`가족 ${fm} · 서빙 ${sv} 시작!`, true); };
}

/* ═════════ 돌아다니기 (실제 앱 흐름)
   얼굴 화면 → [돌아다니기 경로 확인/수정] 경로 설정(선택 · +경로추가) → 경로 추가(경로명 · 기본 정차시간 · 테이블 번호)
   → [로봇 출발] 돌아다니기 화면(이벤트) → 터치하면 일시정지(이동 취소 / 출발지로 보내기) */
let roamRun=false, rpT=null, rDraft=null, rIdx=-1;
const WAITS=[[10,'10초'],[20,'20초'],[30,'30초'],[60,'1분']];
function openRoam(){ OPENED.roam=Date.now(); roamRun=false; show('roam'); }

$('#roamPath').onclick=()=>renderRPath();

  const d=rDraft;
  $('#redit').innerHTML = `<div class="body"><h3>돌아다니기 경로 ${rIdx>=0?'수정':'추가'}</h3>
      <div class="lb">경로명</div><input class="inp" id="reName" maxlength="12" placeholder="경로 이름을 입력하세요 (예: 경로${S.routes.length+1})" value="${esc(d.name)}">

      <div class="re-path"><span class="tg">경로</span>
        ${d.stops.length ? `<div class="re-stops" style="margin-top:.9rem">${d.stops.map((st,k)=>`<div class="re-stop"><span class="ord">${k+1}번</span>${st.t}<small data-rwait="${k}" role="button">${fmtSec(st.w)}</small><button class="del" data-rdel="${k}" aria-label="빼기">×</button></div>`).join('')}</div>`
          : `<div class="re-empty">아래 테이블 번호를 눌러 경로를 만들어요</div>`}</div>
      ${rIdx>=0?`<button class="btn btn-gray" data-rremove style="width:100%;margin:1rem 0 .4rem;height:2.6rem">이 경로 삭제</button>`:''}
    </div>
    <div class="tblpad"><div class="lb">테이블 번호</div><div class="grid">${Array.from({length:S.destCount},(_,k)=>k+1).map(n=>`<button class="key" data-radd="${n}">${n}</button>`).join('')}</div></div>
    <div class="foot"><button data-rcancel>취소</button><button class="ok" data-rok>확인</button></div>`;
}
$('#redit').addEventListener('input', e=>{ if(e.target.id==='reName') rDraft.name=e.target.value; });
$('#redit').addEventListener('change', e=>{ if(e.target.id==='reWait') rDraft.wait=+e.target.value; });
$('#redit').addEventListener('click', e=>{
  const T=q=>e.target.closest(q); let b;
  if((b=T('[data-radd]'))){ if(rDraft.stops.length>=12){ toast('경로는 12곳까지 만들 수 있어요'); return; } rDraft.stops.push({t:+b.dataset.radd, w:rDraft.wait}); renderREdit(); return; }
  if((b=T('[data-rdel]'))){ rDraft.stops.splice(+b.dataset.rdel,1); renderREdit(); return; }
  if((b=T('[data-rwait]'))){ const st=rDraft.stops[+b.dataset.rwait], v=WAITS.map(x=>x[0]); st.w=v[(v.indexOf(st.w)+1)%v.length]; renderREdit(); return; }
  if(T('[data-rcancel]')){ renderRPath(); return; }
  if(T('[data-rremove]')){ S.routes.splice(rIdx,1); S.routeSel=Math.min(S.routeSel, Math.max(0,S.routes.length-1)); save(); renderRPath(); toast('경로를 삭제했어요'); return; }
  if(T('[data-rok]')){
    const nm=rDraft.name.trim();
    if(!nm){ toast('경로명을 입력하세요'); $('#reName').focus(); return; }
    if(!rDraft.stops.length){ toast('테이블 번호를 눌러 경로를 만들어요'); return; }
    rDraft.name=nm;
    if(rIdx>=0) S.routes[rIdx]=rDraft; else { S.routes.push(rDraft); S.routeSel=S.routes.length-1; }
    save(); renderRPath(); toast('적용 완료 되었습니다', true); return; }
});
// 돌아다니기 일시정지: 시간이 지나거나 화면을 터치하면 다시 돌아다니기 · 일시정지 중엔 말하지 않음
function roamPause(){
  paused=true; clearInterval(rpT);
  let left=S.pauseTime||30; const draw=()=>$('#rpSec').textContent=left+'초'; draw();
  $('#rpause').classList.add('on');
  rpT=setInterval(()=>{ left--; draw(); if(left<=0) roamResume(); },1000);
}
function roamClose(){ clearInterval(rpT); rpT=null; paused=false; $('#rpause').classList.remove('on'); }

$('#rpause').addEventListener('click', e=>{
  const b=e.target.closest('[data-rp]');
  if(!b){ roamResume(); return; }
  const was = promoRun ? 'promo' : 'roam';
  roamClose(); stopDisplay(); roamRun=false; promoRun=false;
  if(b.dataset.rp==='cancel'){ if(was==='roam') bizEvent({kind:'roamEnd'}); was==='promo' ? openPromo() : openRoam(); return; }
  trip={kind:was, stops:[], i:0, soup:false, slots:[], returning:true}; goMove();
});

function closeDrawer(){ $('#dim').classList.remove('on'); $('#drawer').classList.remove('on'); }
function goServe(){ const T=myTable(); if(T && slots.every(x=>x==null)){ slots[0]=T; active=Math.min(1,S.trays-1); } renderHome(); show('home'); const hb=$('#home .home-body'); if(hb) hb.scrollTop=0; }   // 트레이(목적지)가 늘 보이게 맨 위부터
document.addEventListener('click', e=>{
  const a=e.target.closest('[data-act]'); if(!a) return;

});
$('#dim').onclick=closeDrawer;
document.querySelectorAll('.dr-item').forEach(b=>b.onclick=()=>{

});

/* ═════════ 비밀번호 ═════════ */
function pinPad(title, onDone){
  let v='';
  const draw=(err)=>{
    $('#modal').innerHTML = `<h4>${title}</h4><div class="pin-dots">${[0,1,2,3].map(i=>`<i class="${i<v.length?'f':''}"></i>`).join('')}</div>
      <div class="pin-pad">${[1,2,3,4,5,6,7,8,9].map(n=>`<button class="key" data-pin="${n}">${n}</button>`).join('')}
      <button class="key" data-pin="x">취소</button><button class="key" data-pin="0">0</button><button class="key" data-pin="d">⌫</button></div>
      <div class="pin-err">${err||''}</div>`;
  };
  draw(); openModal();
  $('#modal').onclick=e=>{
    const b=e.target.closest('[data-pin]'); if(!b) return; const k=b.dataset.pin;
    if(k==='x'){ closeModal(); return; }
    if(k==='d') v=v.slice(0,-1); else if(v.length<4) v+=k;
    draw();
    if(v.length===4){ const r=onDone(v); if(r===false){ v=''; draw('비밀번호가 맞지 않아요'); } }
  };
}
function askPin(ok){
  if(!S.pin){ ok(); return; }
  pinPad('설정 비밀번호를 입력하세요', v=>{ if(v===S.pin){ closeModal(); ok(); return true; } return false; });
}
function openModal(){ $('#modalWrap').classList.add('on'); }
function closeModal(){ $('#modalWrap').classList.remove('on'); $('#modal').onclick=null; }
$('#modalWrap').addEventListener('click', e=>{ if(e.target.id==='modalWrap') closeModal(); });

  const gt=e.target.closest('[data-gtab]'); if(gt){ groupsDraft = groupsDraft || JSON.parse(JSON.stringify(S.groups)); groupTab=+gt.dataset.gtab; keepY(); return; }
  const gdst=e.target.closest('[data-gdest]'); if(gdst){ groupsDraft = groupsDraft || JSON.parse(JSON.stringify(S.groups)); const d=groupsDraft[groupTab].dests, n=+gdst.dataset.gdest; const k=d.indexOf(n); if(k>=0) d.splice(k,1); else { d.push(n); d.sort((a,b)=>a-b); } keepY(); return; }
  const gb=e.target.closest('[data-grp]');
  if(gb){ if(gb.dataset.grp==='apply'){ if(groupsDraft){ groupsDraft.forEach((x,k)=>{ x.name=(x.name||'').trim()||String(k+1); }); S.groups=groupsDraft; save(); } toast('적용 완료 되었습니다', true); }

  const hear=e.target.closest('[data-hear]'); if(hear){ speak(fill(S.ments[hear.dataset.hear], {'목적지':tableLabel(3)}), 1, true); return; }

  if(e.target.closest('[data-addplace]')){ S.guidePlaces.push(''); save(); renderSettings(); return; }
  const dp=e.target.closest('[data-delplace]'); if(dp){ S.guidePlaces.splice(+dp.dataset.delplace,1); save(); renderSettings(); return; }

  if(e.target.closest('[data-resetall]')){

function newPin(){

/* ═════════ 화면 꾸미기 편집기 ═════════ */
let edMode=null, draft=null, draftImg=null, draftDirty=false;
function openEditor(mode){
  edMode=mode; draft=JSON.parse(JSON.stringify(S.content[mode]));
  const im=imgOf(mode); draftImg = im ? (im.food!=null?{food:im.food}: im.video?{video:im.video}:{src:im.src}) : null; draftDirty=false;
  $('#edTitle').textContent = mode==='roam'?'돌아다니기모드 (이벤트)':'홍보모드';
  renderEditor(); show('editor');
}
function readFields(){ document.querySelectorAll('#edBody [data-field]').forEach(el=>{ draft[el.dataset.field]=el.innerText.replace(/\n$/,''); }); }
function renderEditor(){
  $('#edBody').innerHTML = `
    <div class="layouts">${LAYOUTS.map(l=>`<button class="lay ${draft.layout===l.id?'on':''}" data-lay="${l.id}"><span class="radio ${draft.layout===l.id?'on':''}"><i></i>${l.t}</span>${thumb(l.id)}</button>`).join('')}</div>
    <div class="ed-label">배경색</div>
    <div class="swatches">${BGS.map(b=>`<button class="sw ${draft.bg===b.id?'on':''}" data-bg="${b.id}" style="background:${b.bg}" aria-label="${b.id}"></button>`).join('')}</div>
    <div class="ed-stage" id="edStage">${contentHTML(draft, draftImg, true)}</div>
    <div class="ed-tip">초록 점선 글자를 눌러 바로 고칠 수 있어요 · 줄을 바꾸려면 엔터</div>`;
  fitFrames();
}
function thumb(id){
  const B='<div class="b" style="flex:1"></div>', G='<div class="g"></div>';
  const m={ m1:`<div class="b" style="flex:1;display:flex;flex-direction:column;gap:.1rem;padding:.12rem"><div class="g" style="background:#fff"></div><div class="g" style="background:#fff;width:70%;margin:0 auto"></div></div>`,
    m2:`${G}<div class="b" style="height:40%;margin:0 .15rem"></div>${G}`, m3:`${B}${G}${G}`, m4:`${G}${G}${B}`,
    m5:`<div class="b" style="height:30%;width:45%;margin:0 auto"></div>${G}${G}`, basic:`${G}${G}`, poster:B };
  return `<span class="th">${m[id]}</span>`;
}
$('#edBody').addEventListener('click', e=>{
  const l=e.target.closest('[data-lay]'); if(l){ readFields(); draft.layout=l.dataset.lay; draftDirty=true; renderEditor(); return; }
  const b=e.target.closest('[data-bg]'); if(b){ readFields(); draft.bg=b.dataset.bg; draftDirty=true; renderEditor(); return; }
});
$('#edBody').addEventListener('input', ()=>{ draftDirty=true; });
$('#edBack').onclick=()=>{
  readFields();

  $('#modal').innerHTML = `<h4>저장하지 않고 나갈까요?</h4><div class="two"><button class="btn btn-gray" data-m="stay">계속 꾸미기</button><button class="btn btn-fill" data-m="leave">나가기</button></div>`;

// 이미지 넣기
$('#edImg').onclick=()=>{
  readFields();
  $('#modal').innerHTML = `<button class="iconbtn close" data-m="x" aria-label="닫기"><svg class="ico" viewBox="0 0 24 24"><path d="M6 6l12 12M18 6 6 18"/></svg></button>
    <h4>이미지/영상 업로드 방법을<br>선택해주세요</h4>
    <div class="stack"><button class="btn btn-out" data-m="gal">꿈트리 갤러리에서 넣기</button>
    <button class="btn btn-fill" data-m="file">내 파일 업로드</button>
    ${draftImg?`<button class="btn btn-gray" data-m="none">이미지 빼기</button>`:''}</div>
    <input type="file" accept="image/*,video/*" id="fileIn" hidden>`;
  openModal();
  $('#modal').onclick=ev=>{
    const x=ev.target.closest('[data-m]'); if(!x) return; const m=x.dataset.m;
    if(m==='x') closeModal();
    else if(m==='none'){ draftImg=null; draftDirty=true; closeModal(); renderEditor(); }
    else if(m==='file') $('#fileIn').click();
    else if(m==='gal'){
      $('#modal').innerHTML = `<button class="iconbtn close" data-m="x" aria-label="닫기"><svg class="ico" viewBox="0 0 24 24"><path d="M6 6l12 12M18 6 6 18"/></svg></button><h4>꿈트리 갤러리</h4>
        <div class="ed-label" style="margin:.2rem 0 .4rem">예시 포스터 <small style="color:var(--ink3)">(화면 모양 「포스터」로 바뀌어요)</small></div>
        <div class="gallery posters">${POSTERS.map(([src,t])=>`<button data-poster="${src}"><img src="${src}" alt="">${t}</button>`).join('')}</div>
        <div class="ed-label" style="margin:.8rem 0 .4rem">음식 사진</div>
        <div class="gallery">${FOODS.map((f,i)=>`<button data-food="${i}"><span class="sp" style="background-position:${spritePos(i)}"></span>${f}</button>`).join('')}</div>`;
      $('#modal').onclick=e2=>{ if(e2.target.closest('[data-m="x"]')){ closeModal(); return; }
        const ps=e2.target.closest('[data-poster]'); if(ps){ readFields(); draftImg={src:ps.dataset.poster}; draft.layout='poster'; draftDirty=true; closeModal(); renderEditor(); return; }
        const f=e2.target.closest('[data-food]'); if(!f) return; draftImg={food:+f.dataset.food}; draftDirty=true; closeModal(); renderEditor(); };
    }
  };
  $('#fileIn').onchange=ev=>{
    const file=ev.target.files[0]; if(!file) return;
    if(/^video\//.test(file.type)){   // 동영상: 소리 없이 반복 재생 · 200MB까지
      if(file.size > 200*1024*1024){ toast('동영상이 너무 커요 (200MB까지)'); return; }
      draftImg={video:URL.createObjectURL(file), file}; draftDirty=true; bizMark('up_'+edMode); closeModal(); renderEditor(); toast('동영상을 넣었어요'); return;
    }
    const rd=new FileReader();
    rd.onload=()=>{ const im=new Image(); im.onload=()=>{
        const max=1760, sc=Math.min(1, max/Math.max(im.width,im.height));   // 포스터(1200×1760)가 그대로 들어가게
        const c=document.createElement('canvas'); c.width=Math.round(im.width*sc); c.height=Math.round(im.height*sc);
        const x=c.getContext('2d'); x.fillStyle='#fff'; x.fillRect(0,0,c.width,c.height); x.drawImage(im,0,0,c.width,c.height);
        draftImg={src:c.toDataURL('image/jpeg',.9)}; draftDirty=true; bizMark('up_'+edMode); closeModal(); renderEditor(); toast('사진을 넣었어요');
      }; im.onerror=()=>toast('이 사진은 열 수 없어요'); im.src=rd.result; };
    rd.readAsDataURL(file);
  };
};

// 저장하기 → 로봇 동기화
$('#edSave').onclick=()=>{
  readFields();
  $('#modal').innerHTML = `<h4 style="font-size:.85rem">저장한 내용을 로봇에 전송하시겠습니까?<br>동기화 적용을 누르면, 로봇이 재부팅됩니다.</h4>

      if(!LS.set('srv_img_'+edMode, draftImg.src)){ closeModal(); toast('사진이 너무 커서 저장하지 못했어요. 더 작은 사진을 써 주세요'); return; }
      c.img='data'; vidDel(vMode);

/* ═════════ 가게·맵 정보 (영업 미션·이름 연구소에서 써요) ═════════ */
const STORES = [
  {name:'봄날떡집', kind:'분식당', color:'#e9774c', img:'img/store1.jpg'},
  {name:'훈훈비빔', kind:'한식당', color:'#3fa58b', img:'img/store2.jpg'},
  {name:'분노라멘', kind:'일식당', color:'#5583c2', img:'img/store3.jpg'},
  {name:'콤비키친', kind:'양식당', color:'#c8963a', img:'img/store4.jpg'}];
const FAM_COL = ['#e9774c','#3fa58b','#5583c2','#c8963a'];
const PT = { wait:[[169,1238],[584,1238],[1415,1238],[1830,1238]], store:[[446,222],[861,222],[1277,222],[1692,222]],
  table:[null,[447,535],[723,535],[1277,535],[1553,535],[447,950],[723,950],[1277,950],[1553,950]],
  water:[1918,520], snack:[169,180], dishL:[78,960], dishR:[1918,960] };
const MS = () => S.mission;
function menuName(i){ return isNew(i) ? MS().newName.trim() : FOODS[i]; }
function isNew(i){ return i!=null && MS().newFood===i && !!(MS().newName||'').trim(); }
function foodPic(i){ return `<span class="food" style="background-position:${spritePos(i)}"></span>`; }
function roleOf(n){ return n%2===0 ? {drive:'아이', crew:'보호자'} : {drive:'보호자', crew:'아이'}; }
function fmtMS(ms){ const s=Math.max(0,Math.round(ms/1000)); return Math.floor(s/60)+'분 '+String(s%60).padStart(2,'0')+'초'; }
function josaEul(w){ w=String(w); const c=w.charCodeAt(w.length-1); if(c<0xAC00||c>0xD7A3) return w+'을(를)'; return w+((c-0xAC00)%28?'을':'를'); }
function josaRo(w){ w=String(w); const c=w.charCodeAt(w.length-1); if(isNaN(c)) return w; if(c<0xAC00||c>0xD7A3) return w+'(으)로'; const j=(c-0xAC00)%28; return w+(j===0||j===8?'로':'으로'); }
function ding(){
  try{ actx = actx || new (window.AudioContext||window.webkitAudioContext)(); if(actx.state==='suspended') actx.resume();
    [[880,0],[1318.5,.16]].forEach(([f,d])=>{ const o=actx.createOscillator(), g=actx.createGain(); const t=actx.currentTime+d;
      o.type='sine'; o.frequency.value=f; g.gain.setValueAtTime(0,t); g.gain.linearRampToValueAtTime(.25*S.volume,t+.01); g.gain.exponentialRampToValueAtTime(.001,t+.5);
      o.connect(g); g.connect(actx.destination); o.start(t); o.stop(t+.55); });
  }catch(e){}
}

if(S.guideStart && BZ.fam!==S.guideStart-1) bizStart(S.guideStart-1);
goServe(); renderStrip();
